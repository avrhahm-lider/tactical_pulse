version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: tactical_pulse_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tactical_pulse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tactical_pulse"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
